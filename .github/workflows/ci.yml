# Lint, unit tests and integration tests (in a real VS Code) against the latest code2pdf release.
# The weekly run catches a code2pdf release that breaks the extension.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, vscode: stable }
          - { os: ubuntu-24.04, vscode: 1.90.0 }   # the oldest in package.json's engines
          - { os: macos-latest, vscode: stable }
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }}, VS Code ${{ matrix.vscode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install code2pdf (.deb)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o /tmp/code2pdf_all.deb https://github.com/readbysearch/code2pdf/releases/latest/download/code2pdf_all.deb
          sudo apt-get update -qq
          sudo apt-get install -y -qq /tmp/code2pdf_all.deb poppler-utils xvfb
      - name: Install code2pdf (Homebrew)
        if: runner.os == 'macOS'
        run: brew install readbysearch/tap/code2pdf poppler
      - run: code2pdf --version
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - name: Integration tests
        env:
          VSCODE_TEST_VERSION: ${{ matrix.vscode }}
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a ' || '' }}npx vscode-test
      - name: Package
        if: runner.os == 'Linux' && matrix.vscode == 'stable'
        run: npx vsce package
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux' && matrix.vscode == 'stable'
        with:
          name: vsix
          path: "*.vsix"

  # A first print on machines without code2pdf: the extension offers the install, the real
  # command runs in VS Code's terminal, and Print Now prints. One machine per install path.
  fresh:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "macOS, Homebrew", os: macos-latest }
          - { name: "Ubuntu 24.04, .deb", os: ubuntu-latest, image: "ubuntu:24.04" }
          - { name: "Ubuntu 22.04, install.sh", os: ubuntu-latest, image: "ubuntu:22.04" }
    runs-on: ${{ matrix.os }}
    name: Fresh machine, ${{ matrix.name }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Fresh Ubuntu container (wget, python3; no curl, git or code2pdf)
        if: matrix.image
        run: docker run --rm -v "$PWD:/src:ro" ${{ matrix.image }} bash /src/test/fresh-machine.sh
      - uses: actions/setup-node@v4
        if: runner.os == 'macOS'
        with:
          node-version: 22
      - name: The runner has Homebrew but not code2pdf
        if: runner.os == 'macOS'
        run: |
          brew install poppler
          npm ci
          npx tsc -p .
          CODE2PDF_TEST_FILES='out/test/fresh/*.test.js' npx vscode-test || {
            echo "== Homebrew after the test"; brew list --versions code2pdf || true; ls -la /opt/homebrew/bin/code2pdf || true
            ls -lt ~/Library/Logs/Homebrew 2>/dev/null | head; exit 1; }
