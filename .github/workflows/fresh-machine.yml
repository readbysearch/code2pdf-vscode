# A first print on machines without code2pdf: the extension offers the install, the real command
# runs in VS Code's terminal, and Print Now prints. One machine per install path. Separate from
# CI so the quick tests report in minutes; this runs on main, weekly, and by hand.
name: Fresh machine

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fresh:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "macOS, Homebrew", os: macos-latest }
          - { name: "Ubuntu 24.04, apt (sudo)", os: ubuntu-latest, image: "ubuntu:24.04", click: "Install with apt" }
          - { name: "Ubuntu 24.04, for me (no sudo)", os: ubuntu-latest, image: "ubuntu:24.04", click: "Install for Me" }
          - { name: "Ubuntu 22.04, for me (no sudo)", os: ubuntu-latest, image: "ubuntu:22.04", click: "Install for Me" }
          - { name: "Ubuntu 22.04, all users (sudo)", os: ubuntu-latest, image: "ubuntu:22.04", click: "Install for All Users" }
    runs-on: ${{ matrix.os }}
    name: Fresh machine, ${{ matrix.name }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Fresh Ubuntu container (wget, python3; no curl, git or code2pdf)
        if: matrix.image
        run: docker run --rm -e CODE2PDF_TEST_CLICK="${{ matrix.click }}" -v "$PWD:/src:ro" ${{ matrix.image }} bash /src/test/fresh-machine.sh
      - uses: actions/setup-node@v4
        if: runner.os == 'macOS'
        with:
          node-version: 22
      - name: The runner has Homebrew but not code2pdf
        if: runner.os == 'macOS'
        run: |
          brew install poppler
          npm ci
          npx tsc -p .
          CODE2PDF_TEST_FILES='out/test/fresh/*.test.js' npx vscode-test || {
            echo "== Homebrew after the test"; brew list --versions code2pdf || true; ls -la /opt/homebrew/bin/code2pdf || true
            ls -lt ~/Library/Logs/Homebrew 2>/dev/null | head; exit 1; }
